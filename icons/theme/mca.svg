    <rect x="100" y="30" width="100" height="230" fill="#d21034"/>
  </g>
  <path d="M20 62 Q100 40 180 62 L180 150 Q180 215 100 250 Q20 215 20 150 Z" fill="none" stroke="url(#or)" stroke-width="7" stroke-linejoin="round"/>
  <!-- croissant et étoile -->
