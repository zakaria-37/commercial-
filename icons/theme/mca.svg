  <path fill="url(#or)" d="M100 74 l6.8 13.8 15.2 2.2-11 10.7 2.6 15.2-13.6-7.2-13.6 7.2 2.6-15.2-11-10.7 15.2-2.2z"/>
  <!-- lettres -->
  <text x="100" y="205" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="40" fill="url(#or)" letter-spacing="2">MCA</text>
