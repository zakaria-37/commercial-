<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Écusson vert et rouge, étoile et croissant dorés">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc7a"/><stop offset=".5" stop-color="#d4a017"/><stop offset="1" stop-color="#9c7409"/></linearGradient>
    <clipPath id="ecu"><path d="M20 62 Q100 40 180 62 L180 150 Q180 215 100 250 Q20 215 20 150 Z"/></clipPath>
  </defs>
  <!-- étoile du haut -->
  <path fill="url(#or)" d="M100 2 l9.4 19.1 21.1 3.1-15.3 14.9 3.6 21-18.8-9.9-18.8 9.9 3.6-21-15.3-14.9 21.1-3.1z" transform="translate(0 -2) scale(1)"/>
